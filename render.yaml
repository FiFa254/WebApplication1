# Render Blueprint — https://render.com/docs/blueprint-spec
# สร้าง PostgreSQL ฟรีบน Neon (https://neon.tech) แล้วใส่ DATABASE_URL ใน Environment
services:
  - type: web
    name: devfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ForwardedHeaders__TrustAll
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: Admin__Username
        sync: false
      - key: Admin__PasswordHash
        sync: false
