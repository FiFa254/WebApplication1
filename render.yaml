# Render Blueprint — https://render.com/docs/blueprint-spec
# สร้าง PostgreSQL ฟรีบน Neon (https://neon.tech) แล้วใส่ DATABASE_URL ใน Environment
services:
  - type: web
    name: devfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore  # ให้อยู่ region เดียวกับฐานข้อมูล Neon (ap-southeast-1)
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ForwardedHeaders__TrustAll
        value: "true"
      # ใส่ profile ตัวอย่าง 3 คนเมื่อฐานข้อมูลยังว่าง (ไม่แตะข้อมูลจริง)
      - key: Seed__DemoData
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: Admin__Username
        sync: false
      - key: Admin__PasswordHash
        sync: false
